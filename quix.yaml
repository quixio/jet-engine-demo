# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: LabTECH
    application: labview-sim
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: labview-sim
    variables:
      - name: TEST_API_URL
        inputType: FreeText
        value: https://test-manager-backend/api/v1/tests
      - name: ECU_API_URL
        inputType: FreeText
        value: https://ecu/ecu/start
      - name: API_TOKEN
        inputType: Secret
        secretKey: API_TOKEN
  - name: Rig ECU
    application: rig-ecu
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: ecu
    network:
      serviceName: ecu
    variables:
      - name: data_api_endpoint
        inputType: FreeText
        value: https://test-rig-data-api/data
  - name: test-rig-data
    application: test-rig-data
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: test-rig-data
    network:
      serviceName: test-rig-data-api
    variables:
      - name: output
        inputType: OutputTopic
        description: This is the output topic for hello world data
        required: true
        value: edf-data
  - name: Config Enricher
    application: config-enricher
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    state:
      enabled: true
      size: 1
    variables:
      - name: DATA_TOPIC
        inputType: InputTopic
        description: Name of the ingress data topic.
        value: normalised-data
      - name: CONFIG_TOPIC
        inputType: InputTopic
        description: Name of the ingress config topic.
        value: config-updates
      - name: OUTPUT_TOPIC
        inputType: OutputTopic
        description: Name of the output topic to write enriched data to.
        value: config-enriched-data
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Consumer group name.
        required: true
        value: config-enricher
      - name: CONFIG_SDK_TOKEN
        inputType: Secret
        description: SDK token from the config manager's project
        required: true
        secretKey: config_sdk_token
  - name: Test Manager - Backend
    application: test-manager-backend
    version: latest
    deploymentType: Service
    resources:
      cpu: 500
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: backend-api
    network:
      serviceName: test-manager-backend
      ports:
        - port: 80
          targetPort: 8080
    variables:
      - name: MONGO_USER
        inputType: Secret
        required: true
        secretKey: MONGO_USER
      - name: MONGO_PASSWORD
        inputType: Secret
        required: true
        secretKey: MONGO_PASSWORD
      - name: MONGO_HOST
        inputType: FreeText
        required: true
        value: mongodb
      - name: INFLUXDB_USER
        inputType: Secret
        required: true
        secretKey: INFLUXDB_USER
      - name: INFLUXDB_PASSWORD
        inputType: Secret
        required: true
        secretKey: INFLUXDB_PASSWORD
      - name: INFLUXDB_HOST
        inputType: FreeText
        required: true
        value: influxdb
      - name: INFLUXDB_PORT
        inputType: FreeText
        required: true
        value: 8086
      - name: CONFIG_API_URL
        inputType: FreeText
        required: true
        value: {{CONFIG_API_URL}}
      - name: MEASUREMENTS_URL
        inputType: FreeText
        required: true
        value: {{MEASUREMENTS_URL}}
      - name: DATA_LAKE_V2_TOPIC_NAME
        inputType: FreeText
        required: true
        value: {{DATA_LAKE_V2_TOPIC_NAME}}
      - name: ANALYTICS_URL
        inputType: FreeText
        required: true
        value: {{ANALYTICS_URL}}
    blobStorage:
      bind: true
  - name: Dynamic Configuration Manager
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    configuration:
      topic: config-updates
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: test-manager
      mongoPasswordSecret: MONGO_PASSWORD
      mongoDatabase: quix
      mongoCollection: configuration-api
  - name: Test Manager - Frontend
    application: test-manager-frontend
    version: latest
    deploymentType: Service
    resources:
      cpu: 500
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: frontend-7bdbce0
    network:
      serviceName: test-manager-frontend
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: API_URL
        inputType: FreeText
        description: Backend API URL for server-side requests (internal Kubernetes service name)
        required: true
        value: http://test-manager-backend
      - name: NODE_ENV
        inputType: FreeText
        description: Node environment
        required: true
        value: production
      - name: NEXT_TELEMETRY_DISABLED
        inputType: FreeText
        description: Disable Next.js telemetry
        value: 1
      - name: MEASUREMENTS_URL
        inputType: FreeText
        required: true
        value: https://query-ui-quixers-testrigdemodatawarehouse-prod.az-france-0.app.quix.io/
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: Test Manager
        icon: data_thresholding
        order: 1
      globalItem:
        show: true
        label: Test Manager
        icon: build
        order: 0
  - name: Data normalisation
    application: data-normalisation
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: edf-data
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: normalised-data

# This section describes the Topics of the data pipeline
topics:
  - name: http-source
  - name: config-updates
  - name: edf-data
  - name: normalised-data
