name: Data normalisation
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Name of the input topic to listen to.
    defaultValue: edf-data
  - name: output
    inputType: OutputTopic
    multiline: false
    description: Name of the output topic to write to.
    defaultValue: normalised-data
  - name: dead_letter_topic
    inputType: OutputTopic
    description: Topic to route malformed or unprocessable messages to.
    defaultValue: dead-letter-queue
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-transformation
